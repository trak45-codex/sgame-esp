apply plugin: 'com.android.application'

android {
    namespace 'com.sgame.overlay'
    compileSdk 34
    defaultConfig {
        applicationId "com.sgame.overlay"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
