name: Build

on:
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game"
          required: true
          default: "com.tencent.tmgp.sgame"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle
    - name: Set package name
      run: |
        sed -i "s/com.tencent.tmgp.sgame/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        cat module/src/main/cpp/game.h
    - name: Build zygisk module
      run: |
        chmod +x ./gradlew
        ./gradlew :module:assembleRelease
    - name: Build overlay app
      run: |
        ./gradlew :overlay-app:assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: sgame-esp-zygisk-module
        path: out/magisk_module_release/
    - uses: actions/upload-artifact@v4
      with:
        name: sgame-esp-overlay-apk
        path: overlay-app/build/outputs/apk/debug/*.apk
